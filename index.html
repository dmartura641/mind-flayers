function switchFaction(f){faction=f;state=f==='mf'?mfState:orkState;stages.splice(0,12,...(f==='mf'?mfStages:['Acquired','Built','Primed','Basecoats','Shading','Layering','Highlights','Skin details','Clothing / markings','Weapons and details','Basing','Final finishing']));seed.splice(0,seed.length,...(f==='mf'?mfSeed:orkSeed.map(u=>[u.name,u.n,0,0])));rosters.splice(0,rosters.length,...(f==='mf'?mfRosters:[orkRoster]));army=0;cp=0;round=1;losses={};opened.clear();tab='all';document.body.classList.toggle('ork',f==='ork');document.querySelector('header h1').textContent=f==='mf'?'Mind Flayers':'Orks';document.querySelector('header small').textContent=f==='mf'?'REMNANTS OF BAAL · HOBBY LOG':'DA WAAAGH! · HOBBY LOG';document.querySelector('header .muted').textContent=f==='mf'?'Incursion 980 pts · Strike Force 2,000 pts':'Strike Force 2,000 pts';render()}
let tab='all',opened=new Set();const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(faction==='mf'?'mf-tracker-v1':'ork-tracker-v1',JSON.stringify(state));if(faction==='mf')mfState=state;else orkState=state}catch(e){warning='Local saving unavailable; export backups.'}}function render(){let u=state.units, total=u.reduce((a,b)=>a+b.n,0),paint=u.reduce((a,b)=>a+b.counts[11],0),p=u.filter(x=>faction==='ork'?orkRoster.some(r=>orkSeed[r[0]].name===x.name):x.priority),pn=p.reduce((a,b)=>a+b.n,0),pp=p.reduce((a,b)=>a+b.counts[11],0);app.innerHTML=`<nav><button class="${faction==='mf'?'active':''}" onclick="switchFaction('mf')">Mind Flayers</button><button class="${faction==='ork'?'active':''}" onclick="switchFaction('ork')">Orks</button></nav><div class=stats><div class=card><small>${faction==='ork'?'Roster painted':'1K painted'}</small><div class=big>${pp}/${pn}</div><progress max=${pn||1} value=${pp}></progress></div><div class=card><small>Full army painted</small><div class=big>${paint}/${total}</div><progress max=${total||1} value=${paint}></progress></div></div><nav>${[['all','Full army'],['1k','1K priority'],['unfinished','Unfinished'],['projects','Projects'],['rosters','Army lists'],['battle','Battle mode'],['settings','Manage']].filter(([k])=>faction==='mf'||k!=='1k').map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</nav>`;if(tab==='rosters'||tab==='battle'){app.innerHTML+=rosterView();return}if(tab==='projects'){app.innerHTML+=state.projects.map((p,i)=>`<details ${opened.has('p'+i)?'open':''} ontoggle="toggle(this,'p${i}')"><summary><b>${esc(p.name)}</b> <small>${p.done.length}/${p.tasks.length}</small></summary>${p.tasks.map((t,j)=>`<label><input type=checkbox ${p.done.includes(j)?'checked':''} onchange="project(${i},${j},this.checked)">${esc(t)}</label>`).join('')}</details>`).join('');return}if(tab==='settings'){app.innerHTML+=`<div class=card><h2>Add a unit</h2><form onsubmit="add(event)"><input name=name placeholder="Unit name" required><input name=n type=number min=1 max=100 value=5 required><label><input name=priority type=checkbox>1K priority</label><button>Add unit</button></form></div><div class=card><h2>Backups</h2><button onclick="backup()">Export JSON</button><label>Restore backup <input type=file accept=.json onchange="restore(this)"></label><p class=danger>${esc(warning)}</p></div>`;return}app.innerHTML+=u.map((x,i)=>{if(tab==='1k'&&!x.priority||tab==='unfinished'&&x.counts[11]===x.n)return '';return `<details ${opened.has(i)?'open':''} ontoggle="toggle(this,${i})"><summary><b>${esc(x.name)}</b> <span class=tag>${x.priority?'1K':''}</span><div class=muted>${x.counts[11]}/${x.n} finished · ${x.counts[2]}/${x.n} primed</div><progress max=${x.n*stages.length} value=${x.counts.reduce((a,b)=>a+b,0)}></progress></summary>${faction==='ork'?esc(x.note||''):i===16?'<p class=muted>Existing print needs rescaling.</p>':i===17?'<p class=muted>Existing model; build and paint condition unconfirmed.</p>':''}${stages.map((s,j)=>`<div class=stage><span>${s}</span><input aria-label="${s}" type=number min=0 max=${x.n} value=${x.counts[j]} onchange="update(${i},${j},this.value)"></div>`).join('')}<label><input type=checkbox ${x.priority?'checked':''} onchange="priority(${i},this.checked)">1K priority</label><button onclick="finish(${i})">Mark all finished</button></details>`}).join('');}function toggle(el,k){if(el.open)opened.add(k);else opened.delete(k)}function update(i,j,v){let x=state.units[i],n=Math.max(0,Math.min(x.n,Math.floor(Number(v)||0)));x.counts[j]=n;for(let k=0;k<j;k++)x.counts[k]=Math.max(x.counts[k],n);for(let k=j+1;k<stages.length;k++)x.counts[k]=Math.min(x.counts[k],n);save();render()}function priority(i,v){state.units[i].priority=v;save();render()}function finish(i){update(i,11,state.units[i].n)}function project(i,j,v){let p=state.projects[i];p.done=v?[...new Set([...p.done,j])]:p.done.filter(x=>x!==j);save();render()}function add(e){e.preventDefault();let f=new FormData(e.target);state.units.push({name:f.get('name'),n:Number(f.get('n')),priority:f.has('priority'),counts:stages.map(()=>0)});save();tab='all';render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({faction,...state},null,2)],{type:'application/json'}));a.download=faction+'-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let s=JSON.parse(await el.files[0].text());if((s.faction||'mf')!==faction||!Array.isArray(s.units)||!Array.isArray(s.projects)||!s.units.every(x=>typeof x.name==='string'&&Number.isInteger(x.n)&&x.n>0&&Array.isArray(x.counts)&&x.counts.length===stages.length&&x.counts.every(v=>Number.isInteger(v)&&v>=0&&v<=x.n))||!s.projects.every(p=>typeof p.name==='string'&&Array.isArray(p.tasks)&&Array.isArray(p.done)))throw Error();state=s;save();render()}catch(e){alert('Invalid backup file')}}render();</script></body></html>
